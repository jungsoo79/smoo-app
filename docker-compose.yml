services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smoo-backend
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-2}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
    ports:
      - "8080:8080"
    restart: unless-stopped
